<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <style type="text/css" id="current-color-scheme">
      .ColorScheme-Background { color: #24283b; }
      .ColorScheme-Highlight  { color: #7aa2f7; }
    </style>
  </defs>

  <!-- Fondo de los popups: calendario, bandeja, notificaciones.
       Misma forma que el panel, más opaco para que se lea el texto. -->
  <!-- esquina superior izquierda -->
  <g id="topleft">
    <rect x="0" y="0" width="16" height="16" fill="none"/>
    <path d="M0,16 A16,16 0 0 1 16,0 L16,16 Z"
          class="ColorScheme-Background" fill="currentColor" fill-opacity="0.90"/>
    <path d="M1,16 A15,15 0 0 1 16,1"
          class="ColorScheme-Highlight" fill="none" stroke="currentColor"
          stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- borde superior -->
  <g id="top">
    <rect x="16" y="0" width="16" height="16" fill="none"/>
    <rect x="16" y="0" width="16" height="16"
          class="ColorScheme-Background" fill="currentColor" fill-opacity="0.90"/>
    <path d="M16,1 L32,1"
          class="ColorScheme-Highlight" fill="none" stroke="currentColor"
          stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- esquina superior derecha -->
  <g id="topright">
    <rect x="32" y="0" width="16" height="16" fill="none"/>
    <path d="M32,0 A16,16 0 0 1 48,16 L32,16 Z"
          class="ColorScheme-Background" fill="currentColor" fill-opacity="0.90"/>
    <path d="M32,1 A15,15 0 0 1 47,16"
          class="ColorScheme-Highlight" fill="none" stroke="currentColor"
          stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- lado izquierdo -->
  <g id="left">
    <rect x="0" y="16" width="16" height="16" fill="none"/>
    <rect x="0" y="16" width="16" height="16"
          class="ColorScheme-Background" fill="currentColor" fill-opacity="0.90"/>
    <path d="M1,16 L1,32"
          class="ColorScheme-Highlight" fill="none" stroke="currentColor"
          stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- centro -->
  <g id="center">
    <rect x="16" y="16" width="16" height="16"
          class="ColorScheme-Background" fill="currentColor" fill-opacity="0.90"/>
  </g>

  <!-- lado derecho -->
  <g id="right">
    <rect x="32" y="16" width="16" height="16" fill="none"/>
    <rect x="32" y="16" width="16" height="16"
          class="ColorScheme-Background" fill="currentColor" fill-opacity="0.90"/>
    <path d="M47,16 L47,32"
          class="ColorScheme-Highlight" fill="none" stroke="currentColor"
          stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- esquina inferior izquierda -->
  <g id="bottomleft">
    <rect x="0" y="32" width="16" height="16" fill="none"/>
    <path d="M0,32 L16,32 L16,48 A16,16 0 0 1 0,32 Z"
          class="ColorScheme-Background" fill="currentColor" fill-opacity="0.90"/>
    <path d="M1,32 A15,15 0 0 0 16,47"
          class="ColorScheme-Highlight" fill="none" stroke="currentColor"
          stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- borde inferior -->
  <g id="bottom">
    <rect x="16" y="32" width="16" height="16" fill="none"/>
    <rect x="16" y="32" width="16" height="16"
          class="ColorScheme-Background" fill="currentColor" fill-opacity="0.90"/>
    <path d="M16,47 L32,47"
          class="ColorScheme-Highlight" fill="none" stroke="currentColor"
          stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- esquina inferior derecha -->
  <g id="bottomright">
    <rect x="32" y="32" width="16" height="16" fill="none"/>
    <path d="M32,32 L48,32 A16,16 0 0 1 32,48 Z"
          class="ColorScheme-Background" fill="currentColor" fill-opacity="0.90"/>
    <path d="M47,32 A15,15 0 0 1 32,47"
          class="ColorScheme-Highlight" fill="none" stroke="currentColor"
          stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- márgenes internos: cuánto aire deja el panel a sus widgets -->
  <g id="hint-left-margin"><rect x="0" y="0" width="6" height="1" fill="none"/></g>
  <g id="hint-right-margin"><rect x="0" y="0" width="6" height="1" fill="none"/></g>
  <g id="hint-top-margin"><rect x="0" y="0" width="1" height="4" fill="none"/></g>
  <g id="hint-bottom-margin"><rect x="0" y="0" width="1" height="4" fill="none"/></g>
</svg>
