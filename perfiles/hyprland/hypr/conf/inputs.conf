input {
    # us + latam, se alternan con Alt+Shift
    kb_layout = us,latam
    kb_options = grp:alt_shift_toggle

    follow_mouse = 1
    sensitivity = 0

    # Ratón externo
    natural_scroll = false
    accel_profile = flat

    touchpad {
        natural_scroll = true
        scroll_factor = 0.7
        disable_while_typing = true
        tap-to-click = true
    }

    # Descomenta si el cursor parpadea o desaparece
    # cursor {
    #     no_hardware_cursors = true
    # }
}

# Gestos del touchpad (sintaxis de Hyprland 0.49+)
gesture = 4, horizontal, workspace
gesture = 3, down,       close
gesture = 3, up,         fullscreen
gesture = 3, left,       float

# Si tu Hyprland es más viejo y los gestos no responden, borra las 4
# líneas de arriba y descomenta esto:
# gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 4
# }
