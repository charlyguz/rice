# Solo curvas bezier a propósito: los muelles (spring) son recientes y
# no existen en todas las versiones. Esto se ve igual y no falla en ninguna.

animations {
    enabled = true

    bezier = easeOutQuint,   0.23, 1.00, 0.32, 1.00
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1.00
    bezier = linear,         0.00, 0.00, 1.00, 1.00
    bezier = almostLinear,   0.50, 0.50, 0.75, 1.00
    bezier = quick,          0.15, 0.00, 0.10, 1.00
    bezier = overshoot,      0.50, 0.90, 0.10, 1.10

    animation = global,               1, 3, quick
    animation = windows,              1, 3, overshoot, slide
    animation = windowsOut,           1, 3, quick, slide
    animation = border,               1, 6, easeOutQuint
    animation = fade,                 1, 3, quick
    animation = workspaces,           1, 5, quick, slide
    animation = specialWorkspaceIn,   1, 2, quick, slidevert
    animation = specialWorkspaceOut,  1, 2, quick, slidevert
    animation = layers,               1, 3, quick, slide
}
