# Apps por defecto. Cambia estas cinco líneas y cambian todos los atajos.
$mainMod     = SUPER
$TERMINAL    = kitty
$FILEMANAGER = dolphin
$BROWSER     = brave
$EDITOR      = code
$CALCULATOR  = gnome-calculator

# Dónde viven los comandos rice-*. Se llaman por ruta y no por nombre
# a propósito: Hyprland arranca con /bin/sh, que no lee ~/.profile, así
# que ~/.local/bin puede no estar en el PATH al iniciar sesión.
$rice = ~/.local/bin

# 'rice-run' mete la app en su propio scope de systemd si la sesión usa
# UWSM, y si no la lanza normal. Así los binds sirven en cualquier distro.
$run = $rice/rice-run
