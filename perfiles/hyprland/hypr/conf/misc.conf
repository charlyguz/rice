dwindle {
    preserve_split = true
    smart_split = false
}

misc {
    col.splash = $accent
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    middle_click_paste = false

    # El terminal se esconde solo cuando lanzas una app gráfica desde él
    enable_swallow = true
    swallow_regex = ^(kitty|ghostty|[Kk]onsole|Alacritty|gnome-terminal|xfce[0-9]?-terminal)$

    # VRR: 0 apagado · 1 siempre · 2 solo en pantalla completa
    # (tenías 3, que solo existe en Hyprland muy reciente; 2 hace casi lo mismo
    #  y no rompe en Debian/Fedora. Súbelo a 3 si tu versión lo soporta.)
    vrr = 2
}

xwayland {
    force_zero_scaling = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}
