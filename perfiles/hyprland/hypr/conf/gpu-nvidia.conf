# ============================================================
#  NVIDIA — install.sh puso este archivo porque detectó una NVIDIA.
#
#  Sin esto, Hyprland con el driver propietario da ventanas negras,
#  parpadeos y el cursor desapareciendo.
#
#  Lo IMPRESCINDIBLE no está aquí sino en el kernel:
#      nvidia_drm.modeset=1
#  install.sh lo comprueba y lo arregla si falta (pide reiniciar).
#
#  Si cambias de gráfica: ./install.sh --no-packages  y se reemplaza.
# ============================================================

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# GBM_BACKEND lo dejo APAGADO a propósito.
# Durante años fue la receta obligatoria, pero con los drivers de ahora
# suele sobrar y en cambio rompe Firefox y apps de Electron en algunas
# versiones. Si ves ventanas negras o basura en pantalla, descoméntalo:
#   env = GBM_BACKEND,nvidia-drm
# y si empeora, vuelve a comentarlo. Es el primer interruptor que probar.

# Cursor por software. En varias versiones del driver el cursor por
# hardware parpadea o desaparece. No cuesta rendimiento notable.
cursor {
    no_hardware_cursors = true
}

# ¿Dos gráficas (NVIDIA + integrada) y Hyprland arranca en la que no es?
# Mira cuál es cuál con:   ls -l /dev/dri/by-path/
# y descomenta poniendo primero la que quieras usar:
# env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0
