# ============================================================
#  Atajos. Mismos que tenías, traducidos a hyprlang.
#  Todo lo que antes llamaba a Noctalia ahora llama a un script
#  rice-* en ~/.local/bin  (mira 'rice-help').
# ============================================================

# ---------------------- VENTANAS ----------------------
bind = $mainMod,       Escape, exec, hyprctl kill
bind = $mainMod,       Q,      killactive
bind = $mainMod ALT,   Space,  togglefloating
bind = $mainMod,       D,      fullscreen, 1
bind = $mainMod,       F,      fullscreen
bind = $mainMod,       J,      togglesplit
bind = $mainMod,       G,      togglegroup

# Foco
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = ALT,      Tab,   cyclenext
bind = ALT,      Tab,   bringactivetotop
bind = $mainMod, Tab,   exec, $rice/rice-window-switcher

# Mover ventana
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, down,  movewindow, d

# Mover entre monitores
bind = $mainMod ALT,       left,  focusmonitor, -1
bind = $mainMod ALT,       right, focusmonitor, +1
bind = $mainMod ALT SHIFT, left,  movewindow, mon:-1
bind = $mainMod ALT SHIFT, right, movewindow, mon:+1
bind = $mainMod SHIFT, mouse_up,   movewindow, mon:+1
bind = $mainMod SHIFT, mouse_down, movewindow, mon:-1

# Mover a workspace contiguo
bind = $mainMod CTRL SHIFT, right,      movetoworkspace, r+1
bind = $mainMod CTRL SHIFT, left,       movetoworkspace, r-1
bind = $mainMod CTRL SHIFT, mouse_up,   movetoworkspace, r+1
bind = $mainMod CTRL SHIFT, mouse_down, movetoworkspace, r-1

# Mover y redimensionar con el ratón
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Redimensionar con teclado
binde = $mainMod CTRL, H, resizeactive, -40 0
binde = $mainMod CTRL, L, resizeactive,  40 0
binde = $mainMod CTRL, K, resizeactive,  0 -40
binde = $mainMod CTRL, J, resizeactive,  0  40

# ---------------------- LANZAR ----------------------
bind = $mainMod,   Return, exec, $run $TERMINAL
bind = $mainMod,   T,      exec, $run $TERMINAL
bind = $mainMod,   E,      exec, $run $FILEMANAGER
bind = $mainMod,   W,      exec, $run $BROWSER
bind = $mainMod,   C,      exec, $run $CALCULATOR
bind = $mainMod,   N,      exec, $run $EDITOR
bind = CTRL SHIFT, Escape, exec, $rice/rice-sysmon

bind = $mainMod, Space,  exec, $rice/rice-launcher
bind = $mainMod, period, exec, $rice/rice-launcher emoji
bind = $mainMod, X,      exec, $rice/rice-panel
bind = $mainMod, A,      exec, $rice/rice-panel
bind = $mainMod, Z,      exec, $rice/rice-theme menu
bind = $mainMod, L,      exec, $rice/rice-session lock
bind = $mainMod ALT, C,  exec, $rice/rice-session

# ---------------------- HARDWARE ----------------------
# 'l' = funciona con la pantalla bloqueada · 'e' = se repite al dejar pulsado
bindle = , XF86AudioRaiseVolume,  exec, $rice/rice-volume up
bindle = , XF86AudioLowerVolume,  exec, $rice/rice-volume down
bindl  = , XF86AudioMute,         exec, $rice/rice-volume mute
bindl  = , XF86AudioMicMute,      exec, $rice/rice-volume mic-mute
bindle = , XF86MonBrightnessUp,   exec, $rice/rice-brightness up
bindle = , XF86MonBrightnessDown, exec, $rice/rice-brightness down

bindl = , XF86AudioPlay,  exec, $rice/rice-media toggle
bindl = , XF86AudioPause, exec, $rice/rice-media toggle
bindl = , XF86AudioNext,  exec, $rice/rice-media next
bindl = , XF86AudioPrev,  exec, $rice/rice-media prev

# ---------------------- UTILIDADES ----------------------
bind = $mainMod,       P,     exec, hyprpicker -a
bind = ,               Print, exec, $rice/rice-screenshot region
bind = $mainMod,       Print, exec, $rice/rice-screenshot full
bind = $mainMod SHIFT, Print, exec, $rice/rice-screenshot window
bind = $mainMod SHIFT, W,     exec, $rice/rice-wallpaper menu
bind = $mainMod,       V,     exec, $rice/rice-clipboard

# ---------------------- WORKSPACES ----------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod CTRL, right, workspace, m+1
bind = $mainMod CTRL, left,  workspace, m-1
bind = $mainMod CTRL, down,  workspace, emptym

bind = $mainMod, mouse_down,      workspace, m+1
bind = $mainMod, mouse_up,        workspace, m-1
bind = $mainMod CTRL, mouse_down, workspace, m-1
bind = $mainMod CTRL, mouse_up,   workspace, m+1

# Scratchpad
bind = $mainMod,       S, togglespecialworkspace
bind = $mainMod SHIFT, S, movetoworkspace, special

# Emulador de Android (sale en su propio workspace oculto)
bind = $mainMod ALT, A, togglespecialworkspace, android
