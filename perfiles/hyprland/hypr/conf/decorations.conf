# Apariencia. Los $accent / $surface los define colors.conf (rice-theme).

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    extend_border_grab_area = 10
    resize_on_border = true

    col.active_border = $accent $secondary 45deg
    col.inactive_border = $surface

    layout = dwindle
    allow_tearing = false
}

group {
    col.border_active = $accent
    col.border_inactive = $surface
    col.border_locked_active = $error
    col.border_locked_inactive = $surface

    groupbar {
        col.active = $accent
        col.inactive = $surface
        col.locked_active = $error
        col.locked_inactive = $surface
    }
}

decoration {
    rounding = 10
    dim_special = 0.3

    active_opacity = 0.95
    inactive_opacity = 0.85
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 5
        passes = 4
        special = true
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000055)
    }
}

# Las layerrule (blur de la barra, el lanzador y las notificaciones)
# viven en windowrules-*.conf: su sintaxis también cambió en Hyprland 0.53,
# así que siguen el mismo interruptor por versión.
