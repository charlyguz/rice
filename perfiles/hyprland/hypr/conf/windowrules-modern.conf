# ============================================================
#  Reglas de ventana — sintaxis de Hyprland 0.53+
#  ( windowrule = match:<qué> <patrón>, <propiedad> <valor> )
#
#  Si tu Hyprland es anterior a 0.53, install.sh enlaza en su lugar
#  windowrules-v2.conf. Puedes cambiarlo a mano:
#     ln -sf conf/windowrules-v2.conf ~/.config/hypr/conf/windowrules.conf
#
#  Nota: si una regla no la entiende tu versión, Hyprland la ignora y
#  sigue arrancando. No te deja sin sesión.
# ============================================================

# Cualquier ventana flotante nace centrada
windowrule = match:float on, center on

# ---- Picture-in-Picture ----
windowrule = match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$, float on, pin on, keep_aspect_ratio on, size max(monitor_w, monitor_h)*0.25 min(monitor_w, monitor_h)*0.25

# ---- Juegos: todo a su propio workspace, sin decoración ----
windowrule = match:content game, workspace name:gaming
windowrule = match:class ^(steam_app.*|gamescope)$, workspace name:gaming
windowrule = match:class ^(steam)$ match:title ^(Friends List)$, float on
windowrule = match:class ^(steam)$ match:title ^(Launching\.{3})$, float on, center on, workspace name:gaming
windowrule = match:class ^(steam_app.*|gamescope)$ match:title ^(.+)$, content game, decorate off, fullscreen_state 2, size monitor_w monitor_h, sync_fullscreen on

# ---- Emulador de Android: a un workspace especial, que no tape nada ----
#      Se muestra con:  SUPER+ALT+A
windowrule = match:class ^([Ee]mulator|qemu-system.*|.*[Aa]ndroid.?[Ee]mulator.*)$, workspace special:android silent
windowrule = match:title ^(Android Emulator.*|Emulator\s-\s.*|.*:5554.*)$, workspace special:android silent

# ---- Apps ----
windowrule = match:class ^(.*\.exe)$, center on, fullscreen_state 0
windowrule = match:class ^(.*[Ll]auncher.*)$, float on
windowrule = match:class ^(vesktop|discord)$, workspace 3
windowrule = match:class ^(.*[Cc]alc.*)$, float on, size max(monitor_w, monitor_h)*0.17 min(monitor_w, monitor_h)*0.43
windowrule = match:class ^(org\.kde\.keditfiletype)$, float on
windowrule = match:class ^(org\.kde\.ark)$, size max(monitor_w, monitor_h)*0.40 min(monitor_w, monitor_h)*0.40
windowrule = match:class ^(.*satty.*)$, float on, min_size max(monitor_w, monitor_h)*0.35 min(monitor_w, monitor_h)*0.35
windowrule = match:class ^(org\.kde\.dolphin)$ match:title negative:^(Moving.*|Create New.*|Extract.*|Compress.*|Copying.*|Progress.*|Configure.*|Properties.*|Choose\sApplication.*)$, float on, size max(monitor_w, monitor_h)*0.50 min(monitor_w, monitor_h)*0.55

# ---- Opacidad: el navegador, los terminales y el video, siempre opacos ----
windowrule = match:class ^(firefox|zen|brave-browser|Brave-browser|chromium|google-chrome)$, opacity 1.0 override
windowrule = match:class ^(kitty|ghostty|[Kk]onsole|Alacritty|gnome-terminal|xfce[0-9]?-terminal)$, opacity 1.0 override
windowrule = match:class ^(mpv|org\.kde\.haruna|.*plex.*|org\.kde\.gwenview|.*vlc.*)$, opacity 1.0 override
windowrule = match:class ^(code|Code|code-oss|VSCodium)$, opacity 1.0 override

# ---- Ventanitas de utilidad: siempre flotantes ----
windowrule = match:class ^(kvantummanager|qt[56]ct|nwg-look|pavucontrol|org\.pulseaudio\.pavucontrol)$, float on
windowrule = match:class ^(blueman-manager|nm-applet|nm-connection-editor)$, float on
windowrule = match:title ^(Winetricks.*|Protontricks.*)$, float on

# ---- Diálogos comunes ----
windowrule = match:title ^(Open|Authentication Required|Add Folder to Workspace|Choose Files|Save As|Confirm to replace files|File Operation Progress)$, float on
windowrule = match:initial_title ^(Open File)$, float on
windowrule = match:class ^([Xx]dg-desktop-portal-gtk)$, float on
windowrule = match:title ^(File Upload|Choose wallpaper|Library)(.*)$, float on
windowrule = match:class ^(.*dialog.*)$, float on
windowrule = match:title ^(.*dialog.*)$, float on
windowrule = match:class ^(hyprland-share-picker)$, float on

# ---- Ignorar los "maximízame" que mandan las apps ----
windowrule = match:class .*, suppress_event maximize

# ---- Parche para arrastrar cosas en XWayland ----
windowrule = match:class ^$ match:title ^$ match:xwayland on match:float on match:fullscreen off match:pin off, no_focus on

# ============================================================
#  Capas: blur detrás de la barra, el lanzador y los avisos.
#  Es puro adorno: si tu versión no entiende una línea, la ignora
#  (verás un aviso en el log) y todo lo demás sigue funcionando.
#
#  ¿No ves blur en la barra? Comenta este bloque y descomenta el
#  de abajo, que es la sintaxis anterior.
# ============================================================
layerrule = match:namespace ^(waybar)$, blur on, ignore_zero on
layerrule = match:namespace ^(rofi|fuzzel|wofi)$, blur on, ignore_zero on
layerrule = match:namespace ^(notifications|swaync-notification-window)$, blur on
layerrule = match:namespace ^(swaync-control-center)$, blur on, ignore_zero on
layerrule = match:namespace ^(logout_dialog)$, blur on

