# ============================================================
#  Reglas de ventana — sintaxis windowrulev2 (Hyprland < 0.53)
#  Mismas reglas que windowrules-modern.conf, en el formato viejo.
# ============================================================

windowrulev2 = center, floating:1

# Picture-in-Picture
windowrulev2 = float, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrulev2 = pin, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrulev2 = keepaspectratio, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrulev2 = size max(monitor_w, monitor_h)*0.25 min(monitor_w, monitor_h)*0.25, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

# Juegos
windowrulev2 = workspace name:gaming, content:game
windowrulev2 = workspace name:gaming, class:^(steam_app.*|gamescope)$
windowrulev2 = float, class:^(steam)$, title:^(Friends List)$
windowrulev2 = float, class:^(steam)$, title:^(Launching\.{3})$
windowrulev2 = center, class:^(steam)$, title:^(Launching\.{3})$
windowrulev2 = workspace name:gaming, class:^(steam)$, title:^(Launching\.{3})$
windowrulev2 = nodim, class:^(steam_app.*|gamescope)$
windowrulev2 = noborder, class:^(steam_app.*|gamescope)$
windowrulev2 = fullscreenstate 2, class:^(steam_app.*|gamescope)$

# Emulador de Android
windowrulev2 = workspace special:android silent, class:^([Ee]mulator|qemu-system.*|.*[Aa]ndroid.?[Ee]mulator.*)$
windowrulev2 = workspace special:android silent, title:^(Android Emulator.*|Emulator\s-\s.*|.*:5554.*)$

# Apps
windowrulev2 = center, class:^(.*\.exe)$
windowrulev2 = float, class:^(.*[Ll]auncher.*)$
windowrulev2 = workspace 3, class:^(vesktop|discord)$
windowrulev2 = float, class:^(.*[Cc]alc.*)$
windowrulev2 = size max(monitor_w, monitor_h)*0.17 min(monitor_w, monitor_h)*0.43, class:^(.*[Cc]alc.*)$
windowrulev2 = float, class:^(org\.kde\.keditfiletype)$
windowrulev2 = size max(monitor_w, monitor_h)*0.40 min(monitor_w, monitor_h)*0.40, class:^(org\.kde\.ark)$
windowrulev2 = float, class:^(.*satty.*)$
windowrulev2 = float, class:^(org\.kde\.dolphin)$, title:negative:^(Moving.*|Create New.*|Extract.*|Compress.*|Copying.*|Progress.*|Configure.*|Properties.*|Choose\sApplication.*)$
windowrulev2 = size max(monitor_w, monitor_h)*0.50 min(monitor_w, monitor_h)*0.55, class:^(org\.kde\.dolphin)$, title:negative:^(Moving.*|Create New.*|Extract.*|Compress.*|Copying.*|Progress.*|Configure.*|Properties.*|Choose\sApplication.*)$

# Opacidad
windowrulev2 = opacity 1.0 override, class:^(firefox|zen|brave-browser|Brave-browser|chromium|google-chrome)$
windowrulev2 = opacity 1.0 override, class:^(kitty|ghostty|[Kk]onsole|Alacritty|gnome-terminal|xfce[0-9]?-terminal)$
windowrulev2 = opacity 1.0 override, class:^(mpv|org\.kde\.haruna|.*plex.*|org\.kde\.gwenview|.*vlc.*)$
windowrulev2 = opacity 1.0 override, class:^(code|Code|code-oss|VSCodium)$

# Utilidades flotantes
windowrulev2 = float, class:^(kvantummanager|qt[56]ct|nwg-look|pavucontrol|org\.pulseaudio\.pavucontrol)$
windowrulev2 = float, class:^(blueman-manager|nm-applet|nm-connection-editor)$
windowrulev2 = float, title:^(Winetricks.*|Protontricks.*)$

# Diálogos
windowrulev2 = float, title:^(Open|Authentication Required|Add Folder to Workspace|Choose Files|Save As|Confirm to replace files|File Operation Progress)$
windowrulev2 = float, initialTitle:^(Open File)$
windowrulev2 = float, class:^([Xx]dg-desktop-portal-gtk)$
windowrulev2 = float, title:^(File Upload|Choose wallpaper|Library)(.*)$
windowrulev2 = float, class:^(.*dialog.*)$
windowrulev2 = float, title:^(.*dialog.*)$
windowrulev2 = float, class:^(hyprland-share-picker)$

# Varios
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# ============================================================
#  Capas: blur detrás de la barra, el lanzador y los avisos.
# ============================================================
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = blur, fuzzel
layerrule = blur, notifications
layerrule = blur, swaync-notification-window
layerrule = blur, swaync-control-center
layerrule = ignorezero, swaync-control-center
layerrule = blur, logout_dialog
