# Workspaces persistentes: siempre están, aunque estén vacíos.
# Añade más copiando la línea y subiendo el número.
workspace = 1, default:true, persistent:true
workspace = 2, default:true, persistent:true
workspace = 3, default:true, persistent:true

# Workspace de juegos: sin gaps ni bordes, para que nada estorbe.
workspace = name:gaming, gapsin:0, gapsout:0, border:false, rounding:false, decorate:false
