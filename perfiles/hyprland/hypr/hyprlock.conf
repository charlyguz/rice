# Pantalla de bloqueo. Los colores salen de la paleta activa.
source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.17
}

# Reloj
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = 110
    font_family = Outfit SemiBold
    color = $fg
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    font_size = 20
    font_family = Outfit
    color = $fg
    position = 0, 130
    halign = center
    valign = center
}

# Campo de contraseña
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $bg_alt
    font_color = $fg
    fade_on_empty = false
    placeholder_text = <span foreground="##c0caf5">Contraseña</span>
    fail_text = <span foreground="##f7768e">Incorrecta</span>
    rounding = 16
    check_color = $secondary
    fail_color = $error
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    font_size = 16
    font_family = Outfit
    color = $fg
    position = 0, 30
    halign = center
    valign = center
}
