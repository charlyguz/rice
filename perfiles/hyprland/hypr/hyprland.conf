# ============================================================
#  Hyprland — configuración portable
#
#  Está escrita en hyprlang (el hyprland.conf de toda la vida) y no en
#  .lua, que es lo que trae CachyOS. Motivo: el formato Lua existe solo
#  desde Hyprland 0.55, mientras que hyprlang funciona en TODAS las
#  versiones. Un repo, una config, cualquier distro.
#
#  Lo que sí cambia entre versiones son las reglas de ventana (cambiaron
#  en la 0.53), y por eso viven en su propio archivo con dos variantes.
#
#  Los colores NO están aquí: los genera 'rice-theme' en
#  colors.conf. Cambia de paleta con  rice-theme menu
# ============================================================

source = ~/.config/hypr/colors.conf

source = ~/.config/hypr/conf/variables.conf
source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/environment.conf
source = ~/.config/hypr/conf/gpu.conf
source = ~/.config/hypr/conf/decorations.conf
source = ~/.config/hypr/conf/animations.conf
source = ~/.config/hypr/conf/inputs.conf
source = ~/.config/hypr/conf/binds.conf
source = ~/.config/hypr/conf/windowrules.conf
source = ~/.config/hypr/conf/workspaces.conf
source = ~/.config/hypr/conf/misc.conf
source = ~/.config/hypr/conf/autostart.conf

# Tus cosas van aquí: este archivo no lo pisa ninguna actualización.
source = ~/.config/hypr/conf/custom.conf
