# Inactividad — perfil de ESCRITORIO.
# Sin batería no tiene sentido bajar el brillo ni suspender: una PC que se
# suspende sola mientras bajas algo es una molestia, no un ahorro.
# Se bloquea y se apaga la pantalla, y ya.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 10 min: bloquear
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 min: apagar las pantallas (se despiertan con cualquier tecla)
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

