# ============================================================
#  tmux — Tokyo Night
#  Pensado para el modo solo-terminal: por SSH cierras la
#  conexión y la sesión sigue viva.
#     tmux            sesión nueva
#     tmux a          volver a la última
#     Ctrl+a d        salir dejándola corriendo
# ============================================================

# Ctrl+a en vez de Ctrl+b: se teclea sin dislocarse la mano
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 20000
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on

# color real y capacidades de kitty
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc,*256col*:Tc"

# dividir con | y - , y que abran en la carpeta actual
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# moverse entre paneles con Alt+flechas, sin prefijo
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind r source-file ~/.tmux.conf \; display "config recargada"

# ---------------- aspecto: Tokyo Night ----------------
BG="#1a1b26"
FG="#c0caf5"
ACC="#7aa2f7"
ALT="#24283b"
DIM="#565f89"
GRN="#9ece6a"

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=$BG,fg=$FG"
set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[bg=$ACC,fg=$BG,bold] #S #[bg=$BG,fg=$ACC]"
set -g status-right "#[fg=$DIM]#{?client_prefix,#[fg=$GRN]● ,}#[fg=$DIM]%H:%M #[bg=$ALT,fg=$ACC] #h "

setw -g window-status-format "#[fg=$DIM] #I:#W "
setw -g window-status-current-format "#[bg=$ALT,fg=$ACC,bold] #I:#W "

set -g pane-border-style "fg=$ALT"
set -g pane-active-border-style "fg=$ACC"
set -g message-style "bg=$ALT,fg=$ACC"
set -g mode-style "bg=$ACC,fg=$BG"
